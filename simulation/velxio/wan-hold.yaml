name: Cancelled and successful WAN hold
version: 1
author: CYD Virtual Bench
steps:
  - wait-serial: 'SIM READY'
  - touch: {part-id: lcd1, x: 20, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 299, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 20, y: 299, duration: 120ms, wait: true}
  - delay: 500ms
  - touch: {part-id: lcd1, x: 218, y: 20, duration: 500ms, wait: true}
  # Local guest timing: sample the heartbeat on its lit phase.
  # Preserve exact pixels and the original Wokwi scenario timing.
  - delay: 1200ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/wan-hold/cancelled-short-press.png'
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/wan-hold/successful-three-second-hold.png'
