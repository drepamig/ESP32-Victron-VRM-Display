name: Saved network switch progress cancellation rollback and activation
version: 1
author: CYD Virtual Bench
steps:
  - wait-serial: 'SIM READY'
  - touch: {part-id: lcd1, x: 20, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 299, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 20, y: 299, duration: 120ms, wait: true}
  - delay: 300ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 187, y: 20, duration: 120ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 77, y: 68, duration: 120ms, wait: true}
  - delay: 150ms
  - touch: {part-id: lcd1, x: 20, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 42, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 64, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 86, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 108, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 130, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 152, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 174, y: 115, duration: 80ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 177, y: 291, duration: 100ms, wait: true}
  - delay: 2000ms
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 200ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - touch: {part-id: lcd1, x: 77, y: 68, duration: 100ms, wait: true}
  - delay: 1000ms
  - touch: {part-id: lcd1, x: 187, y: 20, duration: 100ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 77, y: 107, duration: 100ms, wait: true}
  - delay: 2000ms
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 200ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - touch: {part-id: lcd1, x: 77, y: 68, duration: 100ms, wait: true}
  - delay: 200ms
  - touch: {part-id: lcd1, x: 43, y: 299, duration: 100ms, wait: true}
  - delay: 1800ms
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 200ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/a-active.png'
  - touch: {part-id: lcd1, x: 77, y: 107, duration: 100ms, wait: true}
  - delay: 200ms
  - touch: {part-id: lcd1, x: 43, y: 299, duration: 100ms, wait: true}
  - delay: 150ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/progress.png'
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 1800ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/cancelled.png'
  - write-serial: "SIM connect=failure\n"
  - wait-serial: 'SIM OK'
  - touch: {part-id: lcd1, x: 43, y: 299, duration: 100ms, wait: true}
  - delay: 150ms
  - touch: {part-id: lcd1, x: 187, y: 20, duration: 100ms, wait: true}
  - delay: 50ms
  - touch: {part-id: lcd1, x: 118, y: 299, duration: 100ms, wait: true}
  - delay: 50ms
  - touch: {part-id: lcd1, x: 43, y: 299, duration: 100ms, wait: true}
  - delay: 50ms
  # B fails at one second. Permit A's later rollback connection to succeed.
  - delay: 1500ms
  - write-serial: "SIM connect=success\n"
  - wait-serial: 'SIM OK'
  - delay: 61000ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/timeout.png'
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 200ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/rollback-a.png'
  - touch: {part-id: lcd1, x: 77, y: 107, duration: 100ms, wait: true}
  - delay: 200ms
  - touch: {part-id: lcd1, x: 43, y: 299, duration: 100ms, wait: true}
  - delay: 1800ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/success.png'
  - touch: {part-id: lcd1, x: 29, y: 20, duration: 100ms, wait: true}
  - delay: 200ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 200ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../../build/simulation/results/saved-switch/b-active.png'
