name: Password keyboard controls
version: 1
author: CYD Virtual Bench
steps:
  - wait-serial: 'SIM READY'
  - touch: {part-id: lcd1, x: 20, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 20, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 219, y: 299, duration: 120ms, wait: true}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 20, y: 299, duration: 120ms, wait: true}
  - delay: 300ms
  - touch-press: {part-id: lcd1, x: 218, y: 20}
  - delay: 3200ms
  - touch-release: {part-id: lcd1}
  - delay: 100ms
  - touch: {part-id: lcd1, x: 187, y: 20, duration: 120ms, wait: true}
  - delay: 300ms
  - touch: {part-id: lcd1, x: 77, y: 68, duration: 120ms, wait: true}
  - delay: 150ms
  - touch: {part-id: lcd1, x: 20, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 42, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 64, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 86, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 108, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 130, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 152, y: 115, duration: 80ms, wait: true}
  - touch: {part-id: lcd1, x: 174, y: 115, duration: 80ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/masked.png'
  - touch: {part-id: lcd1, x: 208, y: 20, duration: 100ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/visible.png'
  - touch: {part-id: lcd1, x: 208, y: 20, duration: 100ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/hidden-again.png'
  - touch: {part-id: lcd1, x: 69, y: 233, duration: 100ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/numbers.png'
  - touch: {part-id: lcd1, x: 69, y: 233, duration: 100ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/symbols.png'
  - touch: {part-id: lcd1, x: 28, y: 233, duration: 100ms, wait: true}
  - touch: {part-id: lcd1, x: 20, y: 115, duration: 100ms, wait: true}
  - touch: {part-id: lcd1, x: 210, y: 233, duration: 100ms, wait: true}
  - delay: 100ms
  - take-screenshot:
      part-id: lcd1
      save-to: '../build/simulation/results/password-entry/backspace.png'
